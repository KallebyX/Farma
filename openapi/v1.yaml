openapi: 3.1.0
info:
  title: Meu Prontuário — Patient API
  version: "1.0.0"
  description: >
    Public, versioned API consumed by the Meu Prontuário apps (web/iOS/Android).
    Authentication is a Bearer patient token (Authorization: Bearer <token>).
    Stable envelope: success → { ok: true, data, nextCursor? }; error → { ok: false, error }.
servers:
  - url: https://farma-liard.vercel.app/api/v1
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, enum: [false] }
        error: { type: string }
    Profile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        birthDate: { type: string, format: date-time, nullable: true }
        sex: { type: string, nullable: true }
        allergies: { type: array, items: { type: string } }
        comorbidities: { type: array, items: { type: string } }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness/version probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      api: { type: string }
                      time: { type: string, format: date-time }
  /me:
    get:
      summary: Authenticated patient's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      profile: { $ref: "#/components/schemas/Profile" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      summary: Update whitelisted profile fields
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                sex: { type: string, enum: [M, F, O] }
                birthDate: { type: string, format: date-time }
                allergies: { type: array, items: { type: string } }
                comorbidities: { type: array, items: { type: string } }
      responses:
        "200": { description: Updated }
        "400": { description: Nothing to update }
        "401": { description: Unauthorized }
  /prescriptions:
    get:
      summary: The patient's digital prescriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { type: array, items: { type: object } }
                  nextCursor: { type: string, nullable: true }
        "401": { description: Unauthorized }
